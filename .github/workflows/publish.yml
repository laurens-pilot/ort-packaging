name: Publish release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build release candidate run ID
        required: true

concurrency:
  group: ort-publish
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Validate build run
        id: build
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "releases may only publish from main; found $GITHUB_REF" >&2
            exit 1
          }
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "build run ID must be a positive integer" >&2
            exit 1
          }

          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" '
              .event == "workflow_dispatch" and
              .status == "completed" and
              .conclusion == "success" and
              .head_branch == "main" and
              .path == ".github/workflows/build.yml" and
              .head_repository.full_name == $repository and
              (.head_sha | test("^[0-9a-f]{40}$")) and
              (.run_attempt | type) == "number" and
              .run_attempt >= 1
            ' <<<"$run" >/dev/null || {
              echo "run $BUILD_RUN_ID is not a successful main-branch release-candidate build" >&2
              exit 1
            }

          echo "commit=$(jq -r .head_sha <<<"$run")" >> "$GITHUB_OUTPUT"
          echo "attempt=$(jq -r .run_attempt <<<"$run")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify build commit belongs to main
        env:
          BUILD_COMMIT: ${{ steps.build.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BUILD_COMMIT^{commit}"
          git merge-base --is-ancestor "$BUILD_COMMIT" origin/main

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          digest-mismatch: error

      - name: Verify release candidate
        id: candidate
        env:
          BUILD_COMMIT: ${{ steps.build.outputs.commit }}
          BUILD_RUN_ATTEMPT: ${{ steps.build.outputs.attempt }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          CANDIDATE_DIR: ${{ runner.temp }}/release-candidate
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-release-candidate.sh \
            "$CANDIDATE_DIR" "$BUILD_RUN_ID" "$BUILD_RUN_ATTEMPT" "$BUILD_COMMIT" \
            >> "$GITHUB_OUTPUT"

          resolved="$(mktemp)"
          bash scripts/resolve-release.sh \
            "$(jq -r .upstream_ort_version "$CANDIDATE_DIR/build-provenance.json")" \
            "$(jq -r .package_revision "$CANDIDATE_DIR/build-provenance.json")" \
            > "$resolved"
          grep -Fqx "ort_commit=$(jq -r .upstream_ort_commit "$CANDIDATE_DIR/build-provenance.json")" "$resolved"

      - name: Determine latest-release status
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          ORT_VERSION: ${{ steps.candidate.outputs.ort_version }}
          PACKAGE_REVISION: ${{ steps.candidate.outputs.package_revision }}
        shell: bash
        run: |
          set -euo pipefail
          current="$ORT_VERSION-r$PACKAGE_REVISION"
          highest="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              sed -nE 's/^ort-([0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]*)$/\1/p' |
              sort -V |
              tail -1
          )"
          latest=false
          if [ -z "$highest" ] || [ "$(printf '%s\n%s\n' "$highest" "$current" | sort -V | tail -1)" = "$current" ]; then
            latest=true
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Publish immutable GitHub release
        env:
          BUILD_COMMIT: ${{ steps.candidate.outputs.packaging_commit }}
          CANDIDATE_DIR: ${{ runner.temp }}/release-candidate
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.latest.outputs.latest }}
          RELEASE_TAG: ${{ steps.candidate.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          latest_flag=--latest=false
          if [ "$LATEST" = true ]; then latest_flag=--latest; fi
          notes="$(mktemp)"
          jq -r .release_notes "$CANDIDATE_DIR/build-provenance.json" > "$notes"

          [ -z "$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG")" ] || {
            echo "tag $RELEASE_TAG already exists" >&2
            exit 1
          }
          gh release create "$RELEASE_TAG" "$CANDIDATE_DIR"/* \
            --target "$BUILD_COMMIT" \
            --title "$RELEASE_TAG" \
            --notes-file "$notes" \
            "$latest_flag"

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq 'if .draft == false and .prerelease == false and .immutable == true and (.assets | length) == 35 then empty else error("published release is not immutable or has the wrong asset count") end'
          [ "$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" | awk '{ print $1 }')" = "$BUILD_COMMIT" ]
