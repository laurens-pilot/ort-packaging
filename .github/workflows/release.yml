name: Build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag
        required: true
        default: ort-1.27.0-webgpu-pilot.1
      ort_ref:
        description: Pinned ONNX Runtime tag
        required: true
        default: v1.27.0
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        type: boolean
        default: true
      scope:
        description: Build the full release matrix or probe only iOS
        required: true
        type: choice
        options:
          - all
          - ios
          - windows
        default: all

permissions:
  contents: read

env:
  ORT_SOURCE_DIR: ${{ github.workspace }}/onnxruntime
  BUILD_ROOT: ${{ github.workspace }}/.build
  DIST_ROOT: ${{ github.workspace }}/.dist

jobs:
  android:
    name: Android ${{ matrix.abi }}
    if: inputs.scope == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/onnxruntime
          ref: ${{ inputs.ort_ref }}
          path: onnxruntime
          fetch-depth: 1

      - uses: microsoft/onnxruntime-github-actions/setup-build-tools@v0.0.9
        with:
          vcpkg-version: "2025.08.27"
          vcpkg-hash: 9a4b32849792e13bee1d24726f073b3881acae4165206ddf1a6378e44a4ddd05b3ee93f55ff46d8e8873b3cbcd06606212989e248f0bd615a5bf365070074079
          cmake-version: "3.31.8"
          cmake-hash: 7939260931098c3f00d2b36de3bee6a0ee3bcae2dba001598c492ed5c82d295c9aa9969654f1ff937fec4d71679541238baaa648c5246f36e14f28f0a62337a0
          add-cmake-to-path: "true"
          disable-terrapin: "true"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      - name: Install pinned Android and host tools
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build unzip zip
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-$ANDROID_TARGET_SDK" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check \
            -r onnxruntime/tools/ci_build/github/linux/docker/scripts/requirements.txt

      - name: Build AAR
        run: scripts/build-android.sh "${{ matrix.abi }}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: ${{ env.DIST_ROOT }}/android-${{ matrix.abi }}/*
          if-no-files-found: error
          retention-days: 14

  android-universal:
    name: Android universal AAR
    if: inputs.scope == 'all'
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/onnxruntime
          ref: ${{ inputs.ort_ref }}
          path: onnxruntime
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: android-*
          path: ${{ runner.temp }}/android-aars

      - name: Merge ABI-specific AARs
        shell: bash
        run: |
          mapfile -t aars < <(find "$RUNNER_TEMP/android-aars" -type f -name '*.aar' | sort)
          [ "${#aars[@]}" -eq 3 ]
          scripts/merge-android-aars.sh "$DIST_ROOT/android" "${aars[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-universal
          path: ${{ env.DIST_ROOT }}/android/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS XCFramework
    if: inputs.scope == 'all' || inputs.scope == 'ios'
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/onnxruntime
          ref: ${{ inputs.ort_ref }}
          path: onnxruntime
          fetch-depth: 1
      - uses: microsoft/onnxruntime-github-actions/setup-build-tools@v0.0.9
        with:
          vcpkg-version: "2025.08.27"
          vcpkg-hash: 9a4b32849792e13bee1d24726f073b3881acae4165206ddf1a6378e44a4ddd05b3ee93f55ff46d8e8873b3cbcd06606212989e248f0bd615a5bf365070074079
          cmake-version: "3.31.8"
          cmake-hash: 99cc9c63ae49f21253efb5921de2ba84ce136018abf08632c92c060ba91d552e0f6acc214e9ba8123dee0cf6d1cf089ca389e321879fd9d719a60d975bcffcc8
          add-cmake-to-path: "true"
          disable-terrapin: "true"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned host tools
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          python -m pip install --disable-pip-version-check \
            -r onnxruntime/tools/ci_build/github/linux/docker/scripts/requirements.txt
          xcodebuild -version

      - name: Build XCFramework
        run: scripts/build-ios.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ${{ env.DIST_ROOT }}/ios/*
          if-no-files-found: error
          retention-days: 14

  unix-desktop:
    name: ${{ matrix.target }}
    if: inputs.scope == 'all'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            cmake_hash: 7939260931098c3f00d2b36de3bee6a0ee3bcae2dba001598c492ed5c82d295c9aa9969654f1ff937fec4d71679541238baaa648c5246f36e14f28f0a62337a0
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            cmake_hash: 8eeb07e966a5340c122979dd2e371708a78adccc85200b22bc7e66028e65513bce5ced6c37fe65aedb94000d970186c5c7562d1ab3dbda911061de46b75345d9
          - target: macos-x64
            runner: macos-15-intel
            cmake_hash: 99cc9c63ae49f21253efb5921de2ba84ce136018abf08632c92c060ba91d552e0f6acc214e9ba8123dee0cf6d1cf089ca389e321879fd9d719a60d975bcffcc8
          - target: macos-arm64
            runner: macos-15
            cmake_hash: 99cc9c63ae49f21253efb5921de2ba84ce136018abf08632c92c060ba91d552e0f6acc214e9ba8123dee0cf6d1cf089ca389e321879fd9d719a60d975bcffcc8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/onnxruntime
          ref: ${{ inputs.ort_ref }}
          path: onnxruntime
          fetch-depth: 1
      - uses: microsoft/onnxruntime-github-actions/setup-build-tools@v0.0.9
        with:
          vcpkg-version: "2025.08.27"
          vcpkg-hash: 9a4b32849792e13bee1d24726f073b3881acae4165206ddf1a6378e44a4ddd05b3ee93f55ff46d8e8873b3cbcd06606212989e248f0bd615a5bf365070074079
          cmake-version: "3.31.8"
          cmake-hash: ${{ matrix.cmake_hash }}
          add-cmake-to-path: "true"
          disable-terrapin: "true"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux host tools
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev ninja-build patchelf

      - name: Install pinned Python build tools
        shell: bash
        run: |
          source versions.env
          python -m pip install --disable-pip-version-check \
            -r onnxruntime/tools/ci_build/github/linux/docker/scripts/requirements.txt

      - name: Build plugin
        run: scripts/build-desktop.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.DIST_ROOT }}/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: ${{ matrix.target }}
    if: inputs.scope == 'all' || inputs.scope == 'windows'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            cmake_hash: 807b774fcb12defff8ce869e602fc5b6279d5b7bf7229ebcf3f7490da3f887d516b9c49a00d50f9179e552ed8737d19835a19ef8f366d1ffda1ad6f3352a90c2
          - target: windows-arm64
            runner: windows-11-arm
            cmake_hash: 86937dc89deabe0ff2a08fe198fcfc70764476b865cca4c6dc3bfc7fb9f7d44d4929af919e26e84aaedef17ad01ffb9683e42c39cb38b409100f723bc5ef1cc0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/onnxruntime
          ref: ${{ inputs.ort_ref }}
          path: onnxruntime
          fetch-depth: 1
      - uses: microsoft/onnxruntime-github-actions/setup-build-tools@v0.0.9
        with:
          vcpkg-version: "2025.08.27"
          vcpkg-hash: 9a4b32849792e13bee1d24726f073b3881acae4165206ddf1a6378e44a4ddd05b3ee93f55ff46d8e8873b3cbcd06606212989e248f0bd615a5bf365070074079
          cmake-version: "3.31.8"
          cmake-hash: ${{ matrix.cmake_hash }}
          add-cmake-to-path: "true"
          disable-terrapin: "true"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned build tools
        shell: pwsh
        run: |
          Get-Content versions.env | ForEach-Object {
            if ($_ -match '^([^#=]+)=(.*)$') { Set-Item "env:$($Matches[1])" $Matches[2] }
          }
          python -m pip install --disable-pip-version-check `
            -r onnxruntime/tools/ci_build/github/windows/python/requirements.txt

      - name: Build plugin
        shell: pwsh
        run: scripts/build-windows.ps1 "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.DIST_ROOT }}/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release assets
    if: inputs.scope == 'all'
    needs: [android-universal, ios, unix-desktop, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: ${{ runner.temp }}/artifacts

      - name: Collect and verify assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          find "$RUNNER_TEMP/artifacts" -type f \
            \( -name '*.aar' -o -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} release-assets/ \;
          [ "$(find release-assets -type f | wc -l)" -ge 10 ]
          (cd release-assets && sha256sum * > SHA256SUMS)

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then prerelease_flag+=(--prerelease); fi
          notes=$(mktemp)
          cat >"$notes" <<EOF
          ONNX Runtime WebGPU packaging build for ${{ inputs.ort_ref }}.

          Android and iOS assets contain a custom ONNX Runtime core with WebGPU built in. Desktop assets contain the WebGPU plugin shared library; Windows archives also include DXC runtime DLLs. See the repository README for compatibility and integration details.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes" \
              "${prerelease_flag[@]}"
          fi
