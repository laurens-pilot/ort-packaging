name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq shellcheck

      - name: Validate shell and configuration files
        shell: bash
        run: |
          set -euo pipefail
          shellcheck -x -P scripts scripts/*.sh
          for script in scripts/*.sh; do bash -n "$script"; done
          jq --exit-status . config/*.json >/dev/null
          # shellcheck disable=SC2016
          pwsh -NoProfile -Command '$errors = $null; Get-ChildItem scripts/*.ps1 | ForEach-Object { [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null }; if ($errors.Count) { $errors | Format-List; exit 1 }'

      - name: Verify pinned ONNX Runtime patches
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$(. versions.env; printf '%s' "$ORT_REF")" \
            https://github.com/microsoft/onnxruntime.git "$RUNNER_TEMP/onnxruntime"
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            git -C "$RUNNER_TEMP/onnxruntime" apply --check "$patch"
            git -C "$RUNNER_TEMP/onnxruntime" apply "$patch"
          done

      - name: Compile portable runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests -B "$RUNNER_TEMP/runtime-smoke" \
            -DORT_INCLUDE_DIR="$RUNNER_TEMP/onnxruntime/include/onnxruntime/core/session"
          cmake --build "$RUNNER_TEMP/runtime-smoke" --parallel
