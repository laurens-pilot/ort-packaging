name: Build release candidate
run-name: ORT ${{ inputs.ort_version }}-r${{ inputs.package_revision }} ${{ inputs.mode }} (${{ inputs.platform }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release candidate or non-publishing branch trial
        type: choice
        options: [release, trial]
        default: release
      platform:
        description: Trials may select one platform; releases require all
        type: choice
        options: [all, android, ios, linux, macos, windows]
        default: all
      ort_version:
        description: Stable upstream ONNX Runtime version (MAJOR.MINOR.PATCH)
        required: true
      package_revision:
        description: Packaging revision
        required: true
        default: "1"

concurrency:
  group: ort-build-${{ inputs.mode }}-${{ inputs.platform }}-${{ inputs.ort_version }}-r${{ inputs.package_revision }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  ORT_SOURCE_DIR: ${{ github.workspace }}/onnxruntime
  BUILD_ROOT: ${{ github.workspace }}/.build
  DIST_ROOT: ${{ github.workspace }}/.dist

jobs:
  release-meta:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      ort_ref: ${{ steps.meta.outputs.ort_ref }}
      ort_version: ${{ steps.meta.outputs.ort_version }}
      ort_commit: ${{ steps.meta.outputs.ort_commit }}
      ort_telemetry: ${{ steps.meta.outputs.ort_telemetry }}
      python_version: ${{ steps.meta.outputs.python_version }}
      node_version: ${{ steps.meta.outputs.node_version }}
      package_channel: ${{ steps.meta.outputs.package_channel }}
      package_revision: ${{ steps.meta.outputs.package_revision }}
      package_label: ${{ steps.meta.outputs.package_label }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      build_env_sha256: ${{ steps.meta.outputs.build_env_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORT_VERSION_INPUT: ${{ inputs.ort_version }}
          PACKAGE_REVISION_INPUT: ${{ inputs.package_revision }}
          BUILD_MODE: ${{ inputs.mode }}
          TARGET_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [ "$BUILD_MODE" = release ]; then
            [[ "$GITHUB_REF" == refs/heads/main && "$TARGET_PLATFORM" == all ]] || {
              echo "release candidates require platform all on main; found $TARGET_PLATFORM on $GITHUB_REF" >&2
              exit 1
            }
            validation="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=1")"
            jq --exit-status --arg sha "$GITHUB_SHA" '.workflow_runs | any(.head_sha == $sha and .conclusion == "success")' <<<"$validation" >/dev/null || {
              echo "Validate has not succeeded on a push of $GITHUB_SHA" >&2
              exit 1
            }
            bash scripts/resolve-release.sh "$ORT_VERSION_INPUT" "$PACKAGE_REVISION_INPUT" >> "$GITHUB_OUTPUT"
          else
            [ "$BUILD_MODE" = trial ]
            bash scripts/resolve-release.sh "$ORT_VERSION_INPUT" "$PACKAGE_REVISION_INPUT" --source-only >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/onnxruntime
          ref: ${{ steps.meta.outputs.ort_commit }}
          path: onnxruntime
          fetch-depth: 1

      - name: Verify patches, build interface, and portable smoke-test headers
        shell: bash
        env:
          ORT_REF: ${{ steps.meta.outputs.ort_ref }}
          ORT_VERSION: ${{ steps.meta.outputs.ort_version }}
          ORT_COMMIT: ${{ steps.meta.outputs.ort_commit }}
          PACKAGE_REVISION: ${{ steps.meta.outputs.package_revision }}
        run: |
          set -euo pipefail
          source scripts/common.sh
          prepare_ort_source
          if ort_supports_no_telemetry; then
            echo "Upstream build supports --no_telemetry"
          else
            echo "Upstream build requires the explicit telemetry CMake definition"
          fi
          jq --exit-status '.build_params | index("--no_telemetry") == null and index("--cmake_extra_defines=onnxruntime_USE_TELEMETRY=OFF") != null' config/android-webgpu.json >/dev/null
          jq --exit-status '.build_params.base | index("--no_telemetry") == null and index("--cmake_extra_defines=onnxruntime_USE_TELEMETRY=OFF") != null' config/ios-coreml.json >/dev/null
          cmake -S tests -B "$RUNNER_TEMP/runtime-smoke" \
            -DORT_INCLUDE_DIR="$GITHUB_WORKSPACE/onnxruntime/include/onnxruntime/core/session"
          cmake --build "$RUNNER_TEMP/runtime-smoke" --parallel
          ctest --test-dir "$RUNNER_TEMP/runtime-smoke" --output-on-failure

  android:
    name: Android ${{ matrix.abi }}
    if: inputs.platform == 'all' || inputs.platform == 'android'
    needs: release-meta
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ORT_REF: ${{ needs.release-meta.outputs.ort_ref }}
      ORT_VERSION: ${{ needs.release-meta.outputs.ort_version }}
      ORT_COMMIT: ${{ needs.release-meta.outputs.ort_commit }}
      PACKAGE_REVISION: ${{ needs.release-meta.outputs.package_revision }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/onnxruntime
          ref: ${{ needs.release-meta.outputs.ort_commit }}
          path: onnxruntime
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.release-meta.outputs.python_version }}

      - name: Install checksum-pinned build tools
        shell: bash
        run: python scripts/setup-tools.py "linux-x64"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.release-meta.outputs.node_version }}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install pinned Android and host tools
        shell: bash
        run: |
          set -euo pipefail
          source build.env
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build unzip zip
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-$ANDROID_TARGET_SDK" "ndk;$ANDROID_NDK_VERSION"
          if [ "${{ matrix.abi }}" = "x86_64" ]; then
            sdkmanager "emulator" "system-images;android-$ANDROID_TARGET_SDK;google_apis;x86_64"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check \
            -r onnxruntime/tools/ci_build/github/linux/docker/scripts/requirements.txt

      - name: Build AAR
        shell: bash
        run: scripts/build-android.sh "${{ matrix.abi }}"

      - name: Run Android packaged runtime inference smoke test
        if: matrix.abi == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          source build.env
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force \
            --name ort-packaging-smoke \
            --package "system-images;android-$ANDROID_TARGET_SDK;google_apis;x86_64" \
            --path "$ANDROID_AVD_HOME/ort-packaging-smoke.avd" \
            --device medium_phone
          available_avds="$("$ANDROID_HOME/emulator/emulator" -list-avds)"
          grep -Fqx 'ort-packaging-smoke' <<<"$available_avds" || {
            printf 'Created AVD was not visible to the emulator. Available AVDs:\n%s\n' "$available_avds" >&2
            exit 1
          }
          [ ! -e /dev/kvm ] || sudo chmod 666 /dev/kvm
          emulator_log="$RUNNER_TEMP/android-emulator.log"
          export ANDROID_SERIAL=emulator-5554
          dump_emulator_diagnostics() {
            echo "--- Android emulator diagnostics ---" >&2
            adb devices -l >&2 || true
            tail -n 300 "$emulator_log" >&2 || true
          }
          cleanup_emulator() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              dump_emulator_diagnostics
            fi
            timeout 10 adb emu kill >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup_emulator EXIT
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd ort-packaging-smoke \
            -port 5554 \
            -no-window -noaudio -no-boot-anim -no-snapshot \
            -gpu swiftshader >"$emulator_log" 2>&1 &
          timeout 180 adb wait-for-device
          # shellcheck disable=SC2016
          timeout 600 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          timeout 300 scripts/test-android-runtime.sh x86_64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-${{ matrix.abi }}
          path: ${{ env.DIST_ROOT }}/android-${{ matrix.abi }}/*
          if-no-files-found: error
          retention-days: 14

  android-universal:
    name: Android universal AAR
    if: inputs.platform == 'all' || inputs.platform == 'android'
    needs: [release-meta, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORT_REF: ${{ needs.release-meta.outputs.ort_ref }}
      ORT_VERSION: ${{ needs.release-meta.outputs.ort_version }}
      ORT_COMMIT: ${{ needs.release-meta.outputs.ort_commit }}
      PACKAGE_REVISION: ${{ needs.release-meta.outputs.package_revision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/onnxruntime
          ref: ${{ needs.release-meta.outputs.ort_commit }}
          path: onnxruntime
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: android-*
          path: ${{ runner.temp }}/android-aars

      - name: Merge ABI-specific AARs
        shell: bash
        run: |
          mapfile -t aars < <(find "$RUNNER_TEMP/android-aars" -type f -name '*.aar' | sort)
          [ "${#aars[@]}" -eq 3 ]
          scripts/merge-android-aars.sh "$DIST_ROOT/android" "${aars[@]}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-universal
          path: ${{ env.DIST_ROOT }}/android/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS CoreML XCFramework
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    needs: release-meta
    runs-on: macos-15
    timeout-minutes: 360
    env:
      ORT_REF: ${{ needs.release-meta.outputs.ort_ref }}
      ORT_VERSION: ${{ needs.release-meta.outputs.ort_version }}
      ORT_COMMIT: ${{ needs.release-meta.outputs.ort_commit }}
      PACKAGE_REVISION: ${{ needs.release-meta.outputs.package_revision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/onnxruntime
          ref: ${{ needs.release-meta.outputs.ort_commit }}
          path: onnxruntime
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.release-meta.outputs.python_version }}

      - name: Install checksum-pinned build tools
        shell: bash
        run: python scripts/setup-tools.py "macos-universal"

      - name: Install Apple packaging requirements
        run: |
          python -m pip install --disable-pip-version-check \
            -r onnxruntime/tools/ci_build/github/apple/ios_packaging/requirements.txt

      - name: Build CoreML XCFramework
        run: scripts/build-ios.sh

      - name: Run iOS CPU and CoreML inference smoke tests
        run: scripts/test-ios-runtime.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios
          path: ${{ env.DIST_ROOT }}/ios/*
          if-no-files-found: error
          retention-days: 14

  linux-desktop:
    name: Build ${{ matrix.target }} in manylinux_2_28
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    needs: release-meta
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container_image }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyPA manylinux_2_28 tag 2025.10.10-1, pinned per architecture.
          - target: linux-x64
            runner: ubuntu-latest
            machine: x86_64
            container_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:66eb5f6dadae4b343b4c22846adc27d2130ae753a7e59f7eb34de545422badd1
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            container_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:dcf585a7412cf82b37fe692a9c06d32f78e933714c01345693ab7d62624cbfa2
    env:
      CC: gcc
      CXX: g++
      ORT_REF: ${{ needs.release-meta.outputs.ort_ref }}
      ORT_VERSION: ${{ needs.release-meta.outputs.ort_version }}
      ORT_COMMIT: ${{ needs.release-meta.outputs.ort_commit }}
      PACKAGE_REVISION: ${{ needs.release-meta.outputs.package_revision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/onnxruntime
          ref: ${{ needs.release-meta.outputs.ort_commit }}
          path: onnxruntime
          fetch-depth: 1

      - name: Trust mounted Git workspaces
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$ORT_SOURCE_DIR"

      - name: Select manylinux Python and verify build baseline
        shell: bash
        run: |
          set -euo pipefail
          source build.env
          [ "$(uname -m)" = "${{ matrix.machine }}" ]
          [ "$(getconf GNU_LIBC_VERSION)" = "glibc $LINUX_MAX_GLIBC" ]
          python_tag="${PYTHON_VERSION//./}"
          python_dir="/opt/python/cp$python_tag-cp$python_tag"
          [ -x "$python_dir/bin/python" ]
          [ "$(gcc -dumpversion | cut -d. -f1)" = 14 ]
          echo "$python_dir/bin" >> "$GITHUB_PATH"
          gcc --version

      - name: Install Linux build tools
        shell: bash
        run: dnf install -y ninja-build patchelf zip

      - name: Install checksum-pinned build tools
        shell: bash
        run: python scripts/setup-tools.py "${{ matrix.target }}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.release-meta.outputs.node_version }}

      - name: Install pinned Python build tools
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            -r onnxruntime/tools/ci_build/github/linux/docker/scripts/requirements.txt

      - name: Build desktop runtime
        run: scripts/build-desktop.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ env.DIST_ROOT }}/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  linux-runtime-smoke:
    name: Test ${{ matrix.target }} on Ubuntu
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    needs: [release-meta, linux-desktop]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ORT_REF: ${{ needs.release-meta.outputs.ort_ref }}
      ORT_VERSION: ${{ needs.release-meta.outputs.ort_version }}
      ORT_COMMIT: ${{ needs.release-meta.outputs.ort_commit }}
      PACKAGE_REVISION: ${{ needs.release-meta.outputs.package_revision }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/onnxruntime
          ref: ${{ needs.release-meta.outputs.ort_commit }}
          path: onnxruntime
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ env.DIST_ROOT }}/${{ matrix.target }}

      - name: Install runtime test tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libvulkan1 mesa-vulkan-drivers

      - name: Extract package and run CPU/WebGPU inference
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$DIST_ROOT/${{ matrix.target }}/package"
          archive="$DIST_ROOT/${{ matrix.target }}/onnxruntime-webgpu-${{ matrix.target }}-${{ needs.release-meta.outputs.ort_version }}-${{ needs.release-meta.outputs.package_label }}.tar.gz"
          [ -f "$archive" ]
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          tar -xzf "$archive" -C "$package_dir"
          scripts/test-desktop-runtime.sh "${{ matrix.target }}"

  macos-desktop:
    name: ${{ matrix.target }}
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    needs: release-meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      ORT_REF: ${{ needs.release-meta.outputs.ort_ref }}
      ORT_VERSION: ${{ needs.release-meta.outputs.ort_version }}
      ORT_COMMIT: ${{ needs.release-meta.outputs.ort_commit }}
      PACKAGE_REVISION: ${{ needs.release-meta.outputs.package_revision }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/onnxruntime
          ref: ${{ needs.release-meta.outputs.ort_commit }}
          path: onnxruntime
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.release-meta.outputs.python_version }}

      - name: Install checksum-pinned build tools
        shell: bash
        run: python scripts/setup-tools.py "macos-universal"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.release-meta.outputs.node_version }}

      - name: Install pinned Python build tools
        shell: bash
        run: |
          source build.env
          python -m pip install --disable-pip-version-check \
            -r onnxruntime/tools/ci_build/github/linux/docker/scripts/requirements.txt

      - name: Build desktop runtime
        run: scripts/build-desktop.sh "${{ matrix.target }}"

      - name: Run packaged runtime smoke tests
        run: scripts/test-desktop-runtime.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ env.DIST_ROOT }}/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: ${{ matrix.target }}
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    needs: release-meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      ORT_REF: ${{ needs.release-meta.outputs.ort_ref }}
      ORT_VERSION: ${{ needs.release-meta.outputs.ort_version }}
      ORT_COMMIT: ${{ needs.release-meta.outputs.ort_commit }}
      PACKAGE_REVISION: ${{ needs.release-meta.outputs.package_revision }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
          - target: windows-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/onnxruntime
          ref: ${{ needs.release-meta.outputs.ort_commit }}
          path: onnxruntime
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.release-meta.outputs.python_version }}

      - name: Install checksum-pinned build tools
        shell: bash
        run: python scripts/setup-tools.py "${{ matrix.target }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.release-meta.outputs.node_version }}

      - name: Install pinned build tools
        shell: pwsh
        run: |
          Get-Content build.env | ForEach-Object {
            if ($_ -match '^([^#=]+)=(.*)$') { Set-Item "env:$($Matches[1])" $Matches[2] }
          }
          python -m pip install --disable-pip-version-check `
            -r onnxruntime/tools/ci_build/github/windows/python/requirements.txt

      - name: Verify Windows compiler and smoke-test headers
        shell: pwsh
        run: |
          $architecture = if ("${{ matrix.target }}" -eq "windows-arm64") { "ARM64" } else { "x64" }
          $testBuildDir = Join-Path $env:RUNNER_TEMP "windows-toolchain-check"
          cmake -S tests -B $testBuildDir -G $env:CMAKE_GENERATOR -A $architecture `
            -D "ORT_INCLUDE_DIR=$env:ORT_SOURCE_DIR/include/onnxruntime/core/session"
          if ($LASTEXITCODE -ne 0) { throw "failed to configure the Windows toolchain check" }
          cmake --build $testBuildDir --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "failed to compile the Windows smoke test" }

      - name: Build plugin
        shell: pwsh
        run: scripts/build-windows.ps1 "${{ matrix.target }}"

      - name: Run packaged runtime smoke tests
        shell: pwsh
        run: scripts/test-windows-runtime.ps1 "${{ matrix.target }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ env.DIST_ROOT }}/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  candidate:
    name: Assemble release candidate
    if: inputs.mode == 'release' && inputs.platform == 'all'
    needs: [release-meta, android-universal, ios, linux-runtime-smoke, macos-desktop, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{android-*,ios,linux-*,macos-*,windows-*}"
          path: ${{ runner.temp }}/artifacts

      - name: Collect and verify assets
        shell: bash
        env:
          ORT_REF: ${{ needs.release-meta.outputs.ort_ref }}
          ORT_VERSION: ${{ needs.release-meta.outputs.ort_version }}
          ORT_COMMIT: ${{ needs.release-meta.outputs.ort_commit }}
          ORT_TELEMETRY: ${{ needs.release-meta.outputs.ort_telemetry }}
          PACKAGE_CHANNEL: ${{ needs.release-meta.outputs.package_channel }}
          PACKAGE_REVISION: ${{ needs.release-meta.outputs.package_revision }}
          PACKAGE_LABEL: ${{ needs.release-meta.outputs.package_label }}
          RELEASE_TAG: ${{ needs.release-meta.outputs.release_tag }}
          BUILD_ENV_SHA256: ${{ needs.release-meta.outputs.build_env_sha256 }}
        run: |
          set -euo pipefail
          mkdir release-assets
          mapfile -d '' binaries < <(
            find "$RUNNER_TEMP/artifacts" -type f \
              \( -name '*.aar' -o -name '*.tar.gz' -o -name '*.zip' \) \
              -print0 | sort -z
          )
          [ "${#binaries[@]}" -eq 11 ]

          for binary in "${binaries[@]}"; do
            cp "$binary" "$binary.sha256" "$binary.manifest.env" release-assets/
          done

          set -a
          source build.env
          set +a
          python3 - <<'PY'
          import json
          import os

          release_notes = (
              f"Custom ONNX Runtime packages for {os.environ['ORT_REF']} ({os.environ['PACKAGE_LABEL']}). "
              "Telemetry is compiled out. Every archive has a verified SHA-256 sidecar and build manifest. "
              f"Android requires API {os.environ['ANDROID_MIN_SDK']}; Apple targets are macOS "
              f"{os.environ['MACOS_MIN_VERSION']} and iOS {os.environ['IOS_MIN_VERSION']}. Linux requires "
              f"no newer than GLIBC {os.environ['LINUX_MAX_GLIBC']} and GLIBCXX {os.environ['LINUX_MAX_GLIBCXX']}. "
              f"Windows archives include the checksum-pinned DXC {os.environ['DXC_VERSION']} runtime DLLs and their licenses. "
              "CI runs packaged CPU inference, Linux WebGPU using software Vulkan, macOS/iOS Simulator "
              "CoreML, and Android x86_64 emulator CPU inference. Windows verifies CPU inference and "
              "WebGPU plugin registration; GPU inference may be skipped when no device is available. "
              "Source commits and release inputs are recorded in build-provenance.json."
          )
          provenance = {
              "release_tag": os.environ["RELEASE_TAG"],
              "packaging_commit": os.environ["GITHUB_SHA"],
              "upstream_ort_ref": os.environ["ORT_REF"],
              "upstream_ort_version": os.environ["ORT_VERSION"],
              "upstream_ort_commit": os.environ["ORT_COMMIT"],
              "ort_telemetry": os.environ["ORT_TELEMETRY"],
              "build_env_sha256": os.environ["BUILD_ENV_SHA256"],
              "package_channel": os.environ["PACKAGE_CHANNEL"],
              "package_revision": int(os.environ["PACKAGE_REVISION"]),
              "package_label": os.environ["PACKAGE_LABEL"],
              "release_scope": "all",
              "github_repository": os.environ["GITHUB_REPOSITORY"],
              "github_build_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_build_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "github_workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "release_notes": release_notes,
          }
          with open("release-assets/build-provenance.json", "w", encoding="utf-8") as provenance_file:
              json.dump(provenance, provenance_file, indent=2, sort_keys=True)
              provenance_file.write("\n")
          PY

          (
            cd release-assets
            mapfile -t binaries < <(find . -maxdepth 1 -type f \
              \( -name '*.aar' -o -name '*.tar.gz' -o -name '*.zip' \) | sort)
            sha256sum "${binaries[@]}" > SHA256SUMS
          )
          bash scripts/verify-release-candidate.sh \
            release-assets "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Write publication instructions
        env:
          RELEASE_TAG: ${{ needs.release-meta.outputs.release_tag }}
        shell: bash
        run: |
          {
            echo "## $RELEASE_TAG candidate built"
            echo
            echo "Complete RELEASE-CHECKLIST.md before publishing."
            echo "Publish from main with build_run_id=$GITHUB_RUN_ID."
            echo
            echo "Candidate artifacts expire after 14 days."
          } >> "$GITHUB_STEP_SUMMARY"
